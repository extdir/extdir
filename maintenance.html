<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Back shortly - extdir</title>
    <!--
        Deliberately one file with no dependencies. It is served while the
        application is being replaced, which is exactly when the stylesheet it would
        otherwise link to may be half-written or hashed under a name that no longer
        exists. A maintenance page that needs the deploy to have finished is not a
        maintenance page.
    -->
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #fbfbfa; color: #1b1b19; padding: 1.5rem;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #14140f; color: #f5f4ee; }
            .muted { color: #a5a49c; }
        }
        main { max-width: 32rem; text-align: center; }
        h1 { font-size: 1.375rem; margin: 0 0 0.75rem; }
        p { margin: 0 0 0.5rem; line-height: 1.6; }
        .muted { color: #6b6a63; font-size: 0.9375rem; }
    </style>
</head>
<body>
<main>
    <h1>Back shortly</h1>
    <p>extdir is being updated. This usually takes under a minute.</p>
    <p class="muted">Nothing is lost. Reload in a moment.</p>
</main>
</body>
</html>
