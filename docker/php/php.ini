; Development settings. Uberspace supplies its own php.ini in production.
memory_limit = 512M
max_execution_time = 120

; Ingestion parses large Packagist p2 documents; the default 100 is not enough
; for deeply nested composer.json payloads.
serialize_precision = -1

date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600

error_reporting = E_ALL
display_errors = On
log_errors = On
