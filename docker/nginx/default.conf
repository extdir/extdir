server {
    listen 80 default_server;
    server_name _;
    root /app/public;

    client_max_body_size 8m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        # Ingestion status endpoints can be slow while a crawl holds a lock.
        fastcgi_read_timeout 120s;

        internal;
    }

    # Any other .php file is a routing mistake, not an entry point.
    location ~ \.php$ {
        return 404;
    }

    access_log /var/log/nginx/extdir_access.log;
    error_log /var/log/nginx/extdir_error.log;
}
