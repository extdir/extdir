; Uberspace service definition. Install with:
;   cp deploy/services/*.ini ~/etc/services.d/
;   supervisorctl reread && supervisorctl update
;
; One service per transport so a wedged build queue cannot starve ingestion —
; the failure mode of a single shared worker is that the slowest message type
; silently blocks every other kind of work.
[program:extdir-worker-ingest]
command=/usr/bin/php83 %(ENV_HOME)s/websites/extdir.com/bin/console messenger:consume ingest enrich --time-limit=3600 --memory-limit=256M
directory=%(ENV_HOME)s/websites/extdir.com
autostart=true
autorestart=true
; Restarting hourly on the time-limit is deliberate: a long-lived PHP process
; accumulates memory and stale Doctrine state, and letting supervisord respawn it
; is cheaper than making the worker perfect.
startsecs=10
stopwaitsecs=30
stdout_logfile=%(ENV_HOME)s/logs/extdir-worker-ingest.log
stderr_logfile=%(ENV_HOME)s/logs/extdir-worker-ingest-error.log
