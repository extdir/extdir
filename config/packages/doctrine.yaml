doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # server_version lives in DATABASE_URL so local and CI cannot silently
        # drift from Uberspace production (MariaDB 10.6.19). See docs/brief.md §5.
        charset: utf8mb4
        default_table_options:
            charset: utf8mb4
            # DBAL 4 renamed this from "collate"; the old key is silently ignored,
            # which produces tables on the server's default collation instead.
            collation: utf8mb4_unicode_ci
            engine: InnoDB

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        # Entities live under src/<Domain>/Entity/ rather than a single src/Entity,
        # so the mapping covers all of src/ and each domain owns its own model.
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src'
                prefix: 'App'
                alias: App
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
