framework:
    http_client:
        default_options:
            timeout: 15
            max_duration: 60
            headers:
                Accept: 'application/json'

        scoped_clients:
            # Package metadata. This host serves the static p2 documents and is
            # explicitly built for high-volume automated access — it is the correct
            # endpoint to hammer, and the one that carries every version's full
            # require block in a single request.
            packagist.repo:
                base_uri: 'https://repo.packagist.org/'
                headers:
                    User-Agent: '%env(EXTDIR_USER_AGENT)%'
                retry_failed:
                    max_retries: 3
                    delay: 1000
                    multiplier: 3

            # The website API: package listing and search. Rate limited far more
            # tightly than repo.packagist.org, so it is used only for discovery.
            packagist.api:
                base_uri: 'https://packagist.org/'
                headers:
                    User-Agent: '%env(EXTDIR_USER_AGENT)%'
                retry_failed:
                    max_retries: 3
                    delay: 2000
                    multiplier: 3

            # OAuth endpoints live on github.com, not api.github.com.
            github.oauth:
                base_uri: 'https://github.com/'
                headers:
                    User-Agent: '%env(EXTDIR_USER_AGENT)%'
                    Accept: 'application/json'

            github.api:
                base_uri: 'https://api.github.com/'
                headers:
                    User-Agent: '%env(EXTDIR_USER_AGENT)%'
                    Accept: 'application/vnd.github+json'
                    X-GitHub-Api-Version: '2022-11-28'
                retry_failed:
                    max_retries: 2
                    delay: 2000
                    multiplier: 4
