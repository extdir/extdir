framework:
    rate_limiter:
        # The imprint address endpoint. Generous for a person, nobody reads their
        # own Impressum five times an hour, and pointless for a harvester, which
        # is the asymmetry the limit is chosen for.
        #
        # Keyed by IP, which is imperfect: a university or an office behind one
        # NAT shares a budget. That is the argument for five rather than one.
        imprint_reveal:
            policy: 'fixed_window'
            limit: 5
            interval: '1 hour'

        # Each attempt makes up to six requests to a stranger's server. Ten tries an
        # hour is patient enough for someone genuinely fumbling a commit and mean
        # enough that the endpoint is not a convenient way to have extdir probe hosts
        # on someone's behalf. Keyed by user rather than IP: this route is behind a
        # login, and an office full of maintainers should not share one budget.
        ownership_proof:
            policy: 'fixed_window'
            limit: 10
            interval: '1 hour'

        # The report form writes to the database without an account, so it needs a
        # ceiling or the moderation queue becomes the attack surface. Ten an hour is
        # far above a genuine rights holder reporting several extensions in one
        # sitting, and far below anything that could bury the queue.
        complaint:
            policy: 'fixed_window'
            limit: 10
            interval: '1 hour'

        # Submitting a repository triggers several GitHub requests and can write a
        # new extension, so it needs a ceiling for the same reason the report form
        # does. Five an hour: a maintainer submits their own plugin once, and someone
        # tidying up after a crawl gap might submit a handful. Anything above that is
        # not a person.
        submission:
            policy: 'fixed_window'
            limit: 5
            interval: '1 hour'

# Tests would exhaust the real budget within one test class, turning an unrelated
# assertion into a 429. The limiter still runs, only the ceiling moves, so the
# 429 path stays testable by exhausting it deliberately, which the rate-limit test
# does against its own client IP so it cannot leak into any other test.
when@test:
    framework:
        rate_limiter:
            imprint_reveal:
                policy: 'fixed_window'
                limit: 50
                interval: '1 hour'
            ownership_proof:
                policy: 'fixed_window'
                limit: 50
                interval: '1 hour'
            complaint:
                policy: 'fixed_window'
                limit: 50
                interval: '1 hour'
            submission:
                policy: 'fixed_window'
                limit: 50
                interval: '1 hour'
