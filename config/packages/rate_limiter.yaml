framework:
    rate_limiter:
        # The imprint address endpoint. Generous for a person — nobody reads their
        # own Impressum five times an hour — and pointless for a harvester, which
        # is the asymmetry the limit is chosen for.
        #
        # Keyed by IP, which is imperfect: a university or an office behind one
        # NAT shares a budget. That is the argument for five rather than one.
        imprint_reveal:
            policy: 'fixed_window'
            limit: 5
            interval: '1 hour'

        # Each attempt makes up to six requests to a stranger's server. Ten tries an
        # hour is patient enough for someone genuinely fumbling a commit and mean
        # enough that the endpoint is not a convenient way to have extdir probe hosts
        # on someone's behalf. Keyed by user rather than IP: this route is behind a
        # login, and an office full of maintainers should not share one budget.
        ownership_proof:
            policy: 'fixed_window'
            limit: 10
            interval: '1 hour'

# Tests would exhaust the real budget within one test class, turning an unrelated
# assertion into a 429. The limiter still runs — only the ceiling moves — so the
# 429 path stays testable by exhausting it deliberately, which the rate-limit test
# does against its own client IP so it cannot leak into any other test.
when@test:
    framework:
        rate_limiter:
            imprint_reveal:
                policy: 'fixed_window'
                limit: 50
                interval: '1 hour'
            ownership_proof:
                policy: 'fixed_window'
                limit: 50
                interval: '1 hour'
