security:
    # No password hashers are configured. There are no passwords: the only way in
    # is GitHub, which already knows who controls which repository. A directory
    # that stored credentials would be holding a liability for no gain.
    providers:
        github_users:
            entity:
                class: App\Submission\Entity\User
                property: githubId

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: github_users
            custom_authenticators:
                - App\Submission\Security\GitHubAuthenticator
            logout:
                path: logout
                target: home

    access_control:
        # Everything a visitor sees stays public. Only the maintainer area needs an
        # identity, and moderation needs a role that no amount of GitHub standing
        # can grant you — it is set by hand.
        - { path: ^/moderate, roles: ROLE_MODERATOR }
        - { path: ^/my, roles: ROLE_USER }

when@prod:
    security:
        access_control:
            # HTTPS everywhere in production, not only on the pages that handle a
            # session. The OAuth callback carries an authorisation code in the query
            # string, so serving it over plaintext would hand that code to anyone on
            # the path — and the privacy policy states that this site uses TLS,
            # which should be true rather than aspirational.
            - { path: ^/, requires_channel: https }
