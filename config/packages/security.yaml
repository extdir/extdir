parameters:
    # Which channel access_control demands. Null imposes nothing, which is what
    # local development over plain HTTP needs; production overrides it to https
    # at the bottom of this file.
    #
    # It is a parameter rather than a second access_control block because Symfony
    # refuses to merge that key across configuration sections, "Configuration
    # path security.access_control cannot be overwritten", and the failure only
    # appears when the prod container is built, which is to say on the server.
    app.required_channel: ~

security:
    # No password hashers are configured. There are no passwords: the only way in
    # is GitHub, which already knows who controls which repository. A directory
    # that stored credentials would be holding a liability for no gain.
    providers:
        github_users:
            entity:
                class: App\Submission\Entity\User
                property: githubId

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: github_users
            custom_authenticators:
                - App\Submission\Security\GitHubAuthenticator
            # Without an entry point the firewall answers an anonymous request to a
            # protected page with a bare 401. The authenticator implements it and
            # redirects to GitHub, remembering where the visitor was headed.
            entry_point: App\Submission\Security\GitHubAuthenticator
            logout:
                path: logout
                target: home

    # First match wins, so the specific paths come before the catch-all.
    #
    # Everything a visitor sees stays public. Only the maintainer area needs an
    # identity, and moderation needs a role that no amount of GitHub standing can
    # grant you, it is set by hand.
    #
    # The final rule exists to carry the channel requirement across the whole
    # site, not to restrict anything: the OAuth callback carries an authorisation
    # code in the query string, so plaintext would hand that code to anyone on the
    # path, and the privacy policy tells visitors this site uses TLS.
    access_control:
        - { path: ^/moderate, roles: ROLE_MODERATOR, requires_channel: '%app.required_channel%' }
        - { path: ^/my, roles: ROLE_USER, requires_channel: '%app.required_channel%' }
        - { path: ^/, roles: PUBLIC_ACCESS, requires_channel: '%app.required_channel%' }

when@prod:
    parameters:
        app.required_channel: https
